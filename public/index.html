<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MISB Manager</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="shell"><aside><div class="brand"><div class="mark">M</div><div><strong>MISB Manager</strong><span>MISB Fund Management</span></div></div><nav>
<button class="nav active" data-view="dashboard">Fund Overview</button><button class="nav" data-view="exposure">Issuer Exposure</button><button class="nav" data-view="receivables">Receivables</button><button class="nav" data-view="profit">Profit Analytics</button><button class="nav" data-view="portfolio">Active Portfolio</button><button class="nav" data-view="cash">Account & Ledger</button><button class="nav" data-view="projection">Cash Projection</button><button class="nav" data-view="monitor">Monitoring</button><button class="nav" data-view="reports">MISB Reports</button><button class="nav" data-view="statement">Account Statement PDF</button><button class="nav" data-view="simcopy">Simulation Copy</button><button class="nav" data-view="data">Data Sources</button></nav><div class="sidefoot">Fund management workspace<br><button id="logoutBtn" class="logout" type="button">Sign out</button></div></aside>
<main><header><div><h1 id="pageTitle">Fund Overview</h1><p id="subtitle">MISB portfolio and liquidity position</p></div><div class="actions"><button id="refreshBtn">Refresh</button><a class="primary" href="/api/export/biweekly.xlsx">Generate Bi-weekly Report</a></div></header>
<section id="banner" class="banner"></section><section id="content"></section></main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><button id="closeModal" class="close">×</button><h2 id="modalTitle">Monitoring</h2><form id="monitorForm"><input type="hidden" id="mCode"><label>Status<select id="mStatus"><option>Normal</option><option>Watch</option><option>Follow-up</option><option>Overdue</option><option>Resolved</option></select></label><label>Owner<input id="mOwner" placeholder="e.g. Albert"></label><label>Next action<input id="mAction" placeholder="What needs to happen next?"></label><label>Review date<input type="date" id="mReview"></label><label>Notes<textarea id="mNotes" rows="5" placeholder="Internal monitoring note"></textarea></label><button class="primary" type="submit">Save monitoring</button></form></div></div>

<div id="noteModal" class="modal hidden"><div class="modalbox wide-modal"><button id="closeNoteModal" class="close">×</button><h2 id="noteTitle">Note payments</h2><div id="noteMeta" class="note-meta"></div><div class="modal-section"><h3>Payment schedule</h3><p class="muted">Tick items that have been paid and record the actual payment date/amount.</p><div id="noteSchedule"></div></div><button id="saveNoteBtn" class="primary" type="button">Save payment status</button></div></div>
<script src="/static/network.js"></script><script src="/static/statements.js"></script><script src="/static/app.js"></script></body></html>
